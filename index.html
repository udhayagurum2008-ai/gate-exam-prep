<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GATE ECE & Placement Intelligence Platform</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg text-lg">GATE</div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">GATE ECE Placement Hub</h1>
        <p class="text-xs text-slate-400">20,000+ Questions • Offline Supported PWA</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="pwaInstallBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-1.5 shadow">
        <span>📲</span> Install App
      </button>
      <span id="offlineBadge" class="bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-full font-medium">Ready</span>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="flex items-center gap-2 w-full md:w-auto">
        <label class="text-sm font-medium text-slate-300">Select Part:</label>
        <button id="btnPart1" onclick="switchPart(1)" class="part-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-500 transition shadow">Part 1</button>
        <button id="btnPart2" onclick="switchPart(2)" class="part-btn bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-600 transition">Part 2</button>
        <button id="btnAll" onclick="switchPart('all')" class="part-btn bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-600 transition">All Parts</button>
      </div>
      <div class="w-full md:w-80">
        <input type="text" id="searchInput" oninput="filterQuestions()" placeholder="Search questions or topics..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>

    <div id="statusBox" class="text-sm text-slate-400 flex justify-between items-center px-1">
      <span id="questionCount">Loading question sets...</span>
      <span id="currentPartLabel" class="font-semibold text-blue-400">Part 1</span>
    </div>

    <div id="questionsContainer" class="space-y-4"></div>
  </main>

  <script src="./public/questions_part1.js"></script>
  <script src="./public/questions_part2.js"></script>
  <script src="./questions_part1.js"></script>
  <script src="./questions_part2.js"></script>

  <script>
    let activePart = 1;
    let deferredPrompt = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA ServiceWorker registered'))
          .catch(err => console.error('PWA SW Registration error:', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('pwaInstallBtn');
      if (installBtn) installBtn.classList.remove('hidden');
    });

    document.getElementById('pwaInstallBtn')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('pwaInstallBtn').classList.add('hidden');
      }
      deferredPrompt = null;
    });

    function getQuestions(part) {
      let q = [];
      if (part === 1 || part === 'all') {
        if (window.GATE_QUESTIONS_PART1) q = q.concat(window.GATE_QUESTIONS_PART1);
        if (window.GATE_QUESTIONS_P1) q = q.concat(window.GATE_QUESTIONS_P1);
      }
      if (part === 2 || part === 'all') {
        if (window.GATE_QUESTIONS_PART2) q = q.concat(window.GATE_QUESTIONS_PART2);
        if (window.GATE_QUESTIONS_P2) q = q.concat(window.GATE_QUESTIONS_P2);
      }
      return q;
    }

    function switchPart(part) {
      activePart = part;
      document.querySelectorAll('.part-btn').forEach(btn => {
        btn.className = 'part-btn bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-600 transition';
      });
      if (part === 1) document.getElementById('btnPart1').className = 'part-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-500 transition shadow';
      else if (part === 2) document.getElementById('btnPart2').className = 'part-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-500 transition shadow';
      else document.getElementById('btnAll').className = 'part-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-500 transition shadow';

      document.getElementById('currentPartLabel').innerText = part === 'all' ? 'All Parts' : 'Part ' + part;
      renderQuestions();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const search = document.getElementById('searchInput').value.toLowerCase();
      let questions = getQuestions(activePart);

      if (search) {
        questions = questions.filter(q => 
          (q.question && q.question.toLowerCase().includes(search)) ||
          (q.topic && q.topic.toLowerCase().includes(search)) ||
          (q.subject && q.subject.toLowerCase().includes(search))
        );
      }

      document.getElementById('questionCount').innerText = `Showing ${questions.length} questions`;

      if (questions.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800 p-8 rounded-xl text-center border border-slate-700">
            <p class="text-slate-400">No questions found for the selected criteria.</p>
          </div>`;
        return;
      }

      container.innerHTML = questions.slice(0, 100).map((q, idx) => `
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm space-y-3">
          <div class="flex justify-between items-start gap-2">
            <span class="bg-blue-900/50 text-blue-300 text-xs px-2.5 py-1 rounded font-mono">Q${q.id || idx + 1}</span>
            <span class="text-xs text-slate-400 font-medium">${q.subject || q.topic || 'GATE ECE'}</span>
          </div>
          <p class="text-slate-100 text-base leading-relaxed">${q.question || q.text || ''}</p>
          ${q.options ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
              ${q.options.map((opt, i) => `<div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 text-xs text-slate-300"><span class="font-bold text-blue-400 mr-1.5">${String.fromCharCode(65+i)}.</span>${opt}</div>`).join('')}
            </div>` : ''}
          ${q.answer ? `
            <details class="pt-2">
              <summary class="text-xs font-semibold text-emerald-400 cursor-pointer hover:underline">Show Answer & Explanation</summary>
              <div class="mt-2 text-xs bg-emerald-950/40 border border-emerald-800/40 p-3 rounded-lg text-emerald-200">
                <strong>Answer:</strong> ${q.answer}
                ${q.explanation ? `<p class="mt-1">${q.explanation}</p>` : ''}
              </div>
            </details>` : ''}
        </div>
      `).join('');
    }

    function filterQuestions() {
      renderQuestions();
    }

    window.addEventListener('DOMContentLoaded', () => {
      switchPart(1);
    });
  </script>
</body>
